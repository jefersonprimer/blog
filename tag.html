<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posts por Tag</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="./image/favicon.png" type="image/x-icon">
</head>
<body>
     <header>
        <div id="header-container">
            <a href="./index.html">
                <img src="./image/logo.png" alt="Primerdev logo" id="logo">
            </a>
            <div class="input-div" id="search-trigger-mobile">
              
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 20 20"
                    fill="currentColor"
                    aria-hidden="true"
                    data-slot="icon"
                    id="icon-search"
                >
                    <path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11ZM2 9a7 7 0 1 1 12.452 4.391l3.328 3.329a.75.75 0 1 1-1.06 1.06l-3.329-3.328A7 7 0 0 1 2 9Z" clip-rule="evenodd"></path>
                </svg>
                <div class="search-placeholder">Pesquisar um post</div>
                
            </div>
            <button class="hamburger-menu" id="hamburger-menu">
                
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true" data-slot="icon" class="h-6 w-6"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"></path></svg>
            </button>
            <nav id="mobile-nav-menu" class="mobile-nav-menu">
                <div class="rigth-section">
                    <div class="input-div" id="search-trigger">
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 20 20"
                            fill="currentColor"
                            aria-hidden="true"
                            data-slot="icon"
                            id="icon-search"
                        >
                            <path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11ZM2 9a7 7 0 1 1 12.452 4.391l3.328 3.329a.75.75 0 1 1-1.06 1.06l-3.329-3.328A7 7 0 0 1 2 9Z" clip-rule="evenodd"></path>
                        </svg>
                        <div class="search-placeholder">Pesquisar um post
                            <span id="key-map">Ctrl + k</span>
                        </div>
                    </div>
                    <div id="container-link">
                        <a href="#" class="link">Linkedin</a>
                        <a href="#" class="link">Github</a>
                        <a href="#" class="link">Portfolio</a>
                    </div>
                </div>
            </nav>
                </div>
            </nav>
        </div>
    </header>
    <main>
        <h1 id="tag-name"></h1>
        <div id="tag-posts-container"></div>
        <div id="load-more-container">
            <button id="load-more-button">Carregar Mais</button>
        </div>
    </main>
    <!-- Modal de Pesquisa -->
     <div id="search-modal" class="search-modal">
        <div class="search-modal-content">
            <div class="search-modal-header">
                <h2>Pesquisar Posts</h2>
                <button id="close-search-modal" class="close-btn">&times;</button>
            </div>
            <div class="search-input-container">
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 20 20"
                    fill="currentColor"
                    class="search-icon"
                >
                    <path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11ZM2 9a7 7 0 1 1 12.452 4.391l3.328 3.329a.75.75 0 1 1-1.06 1.06l-3.329-3.328A7 7 0 0 1 2 9Z" clip-rule="evenodd"></path>
                </svg>
                <input type="text" id="search-input" placeholder="Digite para pesquisar..." autocomplete="off">
            </div>
            <div id="search-hint" class="search-hint">Digite pelo menos 3 caracteres para começar a busca</div>
            
            <div id="search-results" class="search-results">
                <!-- Os resultados da pesquisa aparecerão aqui -->
            </div>
        </div>
    </div>

    <script src="tag.js"></script>
    <script src="app.js"></script>
</body>
</html>
